<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>polyglot-live microphone permission</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #111827;
        color: #f9fafb;
      }

      main {
        max-width: 360px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.5;
        color: #d1d5db;
      }

      .status {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        color: #e5e7eb;
        font-weight: 600;
      }

      .status.is-ready {
        background: rgba(34, 197, 94, 0.18);
        color: #bbf7d0;
      }

      .status.is-error {
        background: rgba(239, 68, 68, 0.18);
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Grant microphone access</h1>
      <p>This window belongs to the <strong>polyglot-live</strong> extension, not the current website tab.</p>
      <p>When Chrome prompts for microphone access, choose <strong>Allow</strong>.</p>
      <div id="status" class="status">Waiting to request microphone access...</div>
    </main>
    <script type="module" src="mic-permission.js"></script>
  </body>
</html>
